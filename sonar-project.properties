sonar.projectName=Rewarp
# Organization/project identifiers are supplied by repository variables in CI.
sonar.sources=Sources/Rewarp,Sources/RewarpCore
sonar.tests=Tests/RewarpCoreTests
sonar.sourceEncoding=UTF-8
# This scan intentionally covers Swift. C is covered by CodeQL; the Zig parser
# needs runtime testing and its separate upstream advisory check.
sonar.exclusions=**/*.metal,**/.DS_Store
