name: Set up pinned Zig
description: Install the reviewed Zig toolchain with checksum verification on macOS
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        source scripts/ghostty-version.env
        case "$(uname -m)" in
          arm64)
            target=aarch64-macos
            checksum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
            ;;
          x86_64)
            target=x86_64-macos
            checksum=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
            ;;
          *) echo 'unsupported Zig runner architecture' >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/zig.tar.xz"
        curl --fail --location --retry 3 --output "$archive" \
          "https://ziglang.org/download/$ZIG_VERSION/zig-$target-$ZIG_VERSION.tar.xz"
        printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
        mkdir -p "$RUNNER_TEMP/rewarp-zig"
        tar -xJf "$archive" -C "$RUNNER_TEMP/rewarp-zig" --strip-components=1
        echo "$RUNNER_TEMP/rewarp-zig" >> "$GITHUB_PATH"
